# errata's own checks: claims this repository makes about itself.
checks:
  - id: docs-use-no-dashes
    reason: >
      CLAUDE.md forbids em dashes, en dashes and spaced hyphens as punctuation in prose. A
      dash that slips into a document is the rule broken in the place an agent reads it.
    scope: repo
    run: [sh, checks/no-dashes.sh]

  - id: docs-relative-links-resolve
    reason: >
      The README and docs link to each other by relative path. A renamed file leaves a link
      that 404s on the forge and sends a reader nowhere, with no error anywhere.
    scope: repo
    run: [sh, checks/relative-links.sh]

  - id: go-toolchain-agrees
    reason: >
      go.mod names the toolchain the release binaries are built with, and the Dockerfile builds
      the image with its own golang tag. When the tag differs, `docker build` ships a binary from
      another toolchain than the release, and a Go security fix that reached go.mod never reaches
      that image. The pattern takes three numbers, so a go.mod or a tag that names only a minor
      version, and so floats, finds no value and is unknown.
    scope: repo
    extract:
      gomod: {regex: {file: go.mod, pattern: '^go (\d+\.\d+\.\d+)$'}}
      dockerfile: {regex: {file: Dockerfile, pattern: '^FROM golang:(\d+\.\d+\.\d+)-'}}
    agree: [gomod, dockerfile]

  - id: readme-names-the-go-minor
    reason: >
      The README tells a developer which Go to install, by its minor version. When it names
      another minor version than go.mod, it sends a developer to install a Go the module does not
      build with. The README states two numbers, so under compare semver it agrees with any patch
      release of that minor version.
    scope: repo
    extract:
      gomod: {regex: {file: go.mod, pattern: '^go (\S+)$'}}
      readme: {regex: {file: README.md, pattern: '^With Go (\d+\.\d+) or later'}}
    agree: [gomod, readme]
    compare: semver

  - id: docs-state-the-max-bytes-bounds
    reason: >
      The README and ADR 0003 tell a user the file size an extractor reads by default and the most
      max_bytes accepts, and the README's errata list section gives the default in bytes. A bound
      changed in internal/extract/core/limits.go and not in them has a user pick max_bytes from a
      number errata no longer enforces, and a file the documentation says loads is refused.
    scope: repo
    extract:
      code_default: {regex: {file: internal/extract/core/limits.go, pattern: '^\s*DefaultMaxBytes = (\d+) << 20$'}}
      code_ceiling: {regex: {file: internal/extract/core/limits.go, pattern: '^\s*MaxMaxBytes = (\d+) << 20$'}}
      readme_default: {regex: {file: README.md, pattern: '(?:\| file size \| |writing 0, keeps )(\d+) MiB'}}
      readme_ceiling: {regex: {file: README.md, pattern: 'or one over \d+ \((\d+) MiB\)'}}
      readme_ceiling_bytes: {regex: {file: README.md, pattern: 'or one over (\d+) \(\d+ MiB\)'}}
      readme_list_default: {regex: {file: README.md, pattern: '^- `max_bytes` of every extractor: (\d+) \(\d+ MiB\)'}}
      readme_list_default_mib: {regex: {file: README.md, pattern: '^- `max_bytes` of every extractor: \d+ \((\d+) MiB\)'}}
      adr_default: {regex: {file: docs/adr/0003-extractors-bound-time-and-size-and-let-memory-fail-closed.md, pattern: 'a file size cap \((\d+) MiB by default'}}
      adr_ceiling: {regex: {file: docs/adr/0003-extractors-bound-time-and-size-and-let-memory-fail-closed.md, pattern: 'never above (\d+) MiB'}}
    assert: |
      readme_default.all(v, v == code_default[0]) && adr_default.all(v, v == code_default[0]) &&
      readme_ceiling.all(v, v == code_ceiling[0]) && adr_ceiling.all(v, v == code_ceiling[0]) &&
      readme_ceiling_bytes.all(v, int(v) == int(code_ceiling[0]) * 1048576) &&
      readme_list_default.all(v, int(v) == int(code_default[0]) * 1048576) &&
      readme_list_default_mib.all(v, v == code_default[0])

  - id: readme-names-the-zone-database
    reason: >
      The README names the IANA time zone release errata embeds, because zone rules change only
      with an errata upgrade and a user reads the release there. internal/rule/zoneinfo.version
      moves whenever the database is copied from a newer toolchain, and a README left behind
      names rules errata no longer applies.
    scope: repo
    extract:
      embedded: {regex: {file: internal/rule/zoneinfo.version, pattern: '^(\w+)$'}}
      readme: {regex: {file: README.md, pattern: '\(release (\w+) in this version\)'}}
    agree: [embedded, readme]

  - id: readme-load-errors-are-run
    reason: >
      The README shows the errors errata prints for two configs that do not load, each under the
      command that prints it. internal/cli/testdata/script/readme_load_errors.txtar runs those
      commands on those configs and compares what errata prints. A README example that differs
      from the script's shows output nobody ran: the README once showed errata.yaml, the name
      only -c prints, where its plain errata check prints the absolute path.
    scope: repo
    extract:
      readme_commands: {regex: {file: README.md, pattern: '^\$ (errata check[^\n]*)\nerrata: load '}}
      readme_errors: {regex: {file: README.md, pattern: '^\$ errata check[^\n]*\n(errata: load [^\n]*(?:\n    [^\n]*)*)$'}}
      script_commands: {regex: {file: internal/cli/testdata/script/readme_load_errors.txtar, pattern: '^! exec (errata check[^\n]*)\ncmp stderr \w+\.txt$'}}
      script_errors: {regex: {file: internal/cli/testdata/script/readme_load_errors.txtar, pattern: '^-- \w+\.txt --\n(errata: load [^\n]*(?:\n    [^\n]*)*)$'}}
    assert: readme_commands == script_commands && readme_errors == script_errors

  - id: readme-states-the-config-limit
    reason: >
      The README's Limits table tells a user the largest errata.yaml errata reads. A limit
      changed in internal/config/config.go and not there has a user write a config the README
      says loads and errata refuses, or keep a config small for a limit errata no longer has.
    scope: repo
    extract:
      code: {regex: {file: internal/config/config.go, pattern: '^const MaxConfigBytes = (\d+) << 20$'}}
      readme_mib: {regex: {file: README.md, pattern: '^\| the config file \| (\d+) MiB \(\d+ bytes\) \|'}}
      readme_bytes: {regex: {file: README.md, pattern: '^\| the config file \| \d+ MiB \((\d+) bytes\) \|'}}
    assert: readme_mib.all(v, v == code[0]) && readme_bytes.all(v, int(v) == int(code[0]) * 1048576)
