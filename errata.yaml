# errata's own checks: claims this repository makes about itself.
checks:
  - id: docs-use-no-dashes
    reason: >
      CLAUDE.md forbids em dashes, en dashes and spaced hyphens as punctuation in prose. A
      dash that slips into a document is the rule broken in the place an agent reads it.
    scope: repo
    run: [sh, checks/no-dashes.sh]

  - id: docs-relative-links-resolve
    reason: >
      The README and docs link to each other by relative path. A renamed file leaves a link
      that 404s on the forge and sends a reader nowhere, with no error anywhere.
    scope: repo
    run: [sh, checks/relative-links.sh]

  - id: go-toolchain-agrees
    reason: >
      go.mod names the toolchain the release binaries are built with, the Dockerfile builds the
      image with its own golang tag, and the README tells a developer which Go to install. When
      the Dockerfile's tag differs, `docker build` ships a binary from another toolchain than the
      release, and a Go security fix that reached go.mod never reaches that image. When the
      README names another minor version than go.mod, it sends a developer to install a Go the
      module does not build with.
    scope: repo
    extract:
      gomod: {regex: {file: go.mod, pattern: '^go (\S+)$'}}
      dockerfile: {regex: {file: Dockerfile, pattern: '^FROM golang:([0-9.]+)-'}}
      readme: {regex: {file: README.md, pattern: '^With Go (\d+\.\d+) or later'}}
    assert: dockerfile.all(d, d == gomod[0]) && gomod[0].startsWith(readme[0] + '.')

  - id: docs-state-the-max-bytes-bounds
    reason: >
      The README and ADR 0003 tell a user the file size an extractor reads by default and the
      most max_bytes accepts. A bound changed in internal/extract/core/limits.go and not in them has a
      user pick max_bytes from a number errata no longer enforces, and a file the documentation
      says loads is refused.
    scope: repo
    extract:
      code_default: {regex: {file: internal/extract/core/limits.go, pattern: '^\s*DefaultMaxBytes = (\d+) << 20$'}}
      code_ceiling: {regex: {file: internal/extract/core/limits.go, pattern: '^\s*MaxMaxBytes = (\d+) << 20$'}}
      readme_default: {regex: {file: README.md, pattern: '(?:\| file size \| |writing 0, keeps )(\d+) MiB'}}
      readme_ceiling: {regex: {file: README.md, pattern: 'or one over \d+ \((\d+) MiB\)'}}
      readme_ceiling_bytes: {regex: {file: README.md, pattern: 'or one over (\d+) \(\d+ MiB\)'}}
      adr_default: {regex: {file: docs/adr/0003-extractors-bound-time-and-size-and-let-memory-fail-closed.md, pattern: 'a file size cap \((\d+) MiB by default'}}
      adr_ceiling: {regex: {file: docs/adr/0003-extractors-bound-time-and-size-and-let-memory-fail-closed.md, pattern: 'never above (\d+) MiB'}}
    assert: |
      readme_default.all(v, v == code_default[0]) && adr_default.all(v, v == code_default[0]) &&
      readme_ceiling.all(v, v == code_ceiling[0]) && adr_ceiling.all(v, v == code_ceiling[0]) &&
      readme_ceiling_bytes.all(v, int(v) == int(code_ceiling[0]) * 1048576)

  - id: readme-names-the-zone-database
    reason: >
      The README names the IANA time zone release errata embeds, because zone rules change only
      with an errata upgrade and a user reads the release there. internal/rule/zoneinfo.version
      moves whenever the database is copied from a newer toolchain, and a README left behind
      names rules errata no longer applies.
    scope: repo
    extract:
      embedded: {regex: {file: internal/rule/zoneinfo.version, pattern: '^(\w+)$'}}
      readme: {regex: {file: README.md, pattern: '\(release (\w+) in this version\)'}}
    agree: [embedded, readme]
