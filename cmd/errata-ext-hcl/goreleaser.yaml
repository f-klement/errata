# The release of errata-ext-hcl, on a tag errata-ext-hcl/v<version> (ADR 0021, What a plugin
# release publishes; ci/README.md, Plugin releases). ci/release.sh runs it in a clone of the
# mirror at the tag, with ERRATA_EXT_VERSION set to the tag's version without the v, and
# --skip=validate, since GoReleaser reads no semver in such a tag: {{ .Version }} would be the
# whole tag, so every template here reads the variable instead. The asset names are the ones
# internal/plugin/install fetches (TestReleaseConfigNamesWhatInstallFetches holds them together).
# `make plugin-release-dry PLUGIN=hcl` builds them locally and uploads nothing.
version: 2

project_name: errata-ext-hcl

builds:
  - main: ./cmd/errata-ext-hcl
    binary: errata-ext-hcl
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/f-klement/errata/internal/ext/hcl.Version={{ .Env.ERRATA_EXT_VERSION }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# Each platform's asset is the executable itself, not an archive: one sha256 is then the same
# bytes in the checksums file, errata.lock, the cache and a vendored directory.
archives:
  - formats: [binary]
    name_template: "errata-ext-hcl_{{ .Os }}_{{ .Arch }}"

# The plugin links modules under other licences than errata's, HCL's MPL-2.0 among them, and
# their notices ship beside it as one more asset, which the checksums file lists as it lists the
# executables. ci/release.sh and make plugin-release-dry write the file into build/ before
# GoReleaser runs, with ci/plugin-notices.sh, from the modules the tag links and the module cache; it
# is in no commit. GoReleaser fails on a glob that matches nothing.
checksum:
  name_template: errata-ext-hcl_checksums.txt
  extra_files:
    - glob: ./build/errata-ext-hcl_NOTICES.txt
      name_template: errata-ext-hcl_NOTICES.txt

release:
  github:
    owner: f-klement
    name: errata
  name_template: "errata-ext-hcl {{ .Env.ERRATA_EXT_VERSION }}"
  # errata's own release stays the latest, so the releases page and releases/latest name it.
  make_latest: false
  extra_files:
    - glob: ./build/errata-ext-hcl_NOTICES.txt
      name_template: errata-ext-hcl_NOTICES.txt
