# golangci-lint v2. Each linter here catches a defect class, not a style
# preference; style is gofmt and goimports, enforced as formatters.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint      # errors compared with == or type-asserted, which breaks on wrapped errors
    - nilerr         # returns nil after checking err != nil
    - gosec          # exec with tainted input, file permissions, weak crypto
    - gocritic       # a broad set of bug patterns (appendAssign, badCond, dupBranchBody)
    - revive         # exported identifiers without a doc comment, among others
    - exhaustive     # a switch on Scope or Verdict that misses a value
    - unparam        # a parameter that always receives the same value
    - unconvert      # needless conversions that hide a type mismatch
    - nolintlint     # a //nolint without a linter name and a reason
    - misspell
    - copyloopvar
    - intrange
    - perfsprint
    - usetesting     # os.MkdirTemp in tests instead of t.TempDir
    - thelper        # test helpers without t.Helper(), which misreport the failing line
    - forbidigo      # no fmt.Print* outside the CLI: output goes through a Reporter
    - noctx          # exec and net calls without a context cannot be cancelled
    - depguard       # internal/rule importing a package that reads a file, such as the machine's zone files
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an io.Writer passed in, so tests can capture output
        # A verdict must not depend on the machine's zone files, ZONEINFO or TZ.
        - pattern: ^time\.LoadLocation$
          msg: read a named zone with rule's zone(), from the embedded database, never the machine's
        - pattern: ^time\.Local$
          msg: Local is the machine's zone; a verdict must not depend on where errata runs
        # archive/zip is on internal/rule's allow list for the embedded zones; OpenReader would
        # read a zip from the disk.
        - pattern: ^zip\.OpenReader$
          msg: read the embedded zone database with zip.NewReader; errata reads no zip from the disk
    depguard:
      rules:
        # internal/rule evaluates over extracted values and embedded data and reads no file, so
        # no machine state, zone files included, can reach a verdict. An allow list, because a
        # deny list misses a package that reads a file without os (net/http's http.Dir did). Each
        # standard package ends in $, an exact match, since a bare io would admit io/ioutil.
        # errata's own packages stop at check, semver and minimatch: extract reads files.
        # internal/semver and internal/minimatch are held to the same list, since rule's
        # verdicts rest on them.
        rule-reads-no-files:
          list-mode: strict
          # Both globs: the second needs a directory between rule/ and the file, so it
          # covers a subpackage and not the package itself.
          files:
            - "**/internal/rule/*.go"
            - "**/internal/rule/**/*.go"
            - "**/internal/semver/*.go"
            - "**/internal/minimatch/*.go"
            - "!$test"
          allow:
            - archive/zip$
            - bytes$
            - context$
            - embed$
            - errors$
            - fmt$
            - hash/fnv$
            - io$
            - maps$
            - math$
            - net/netip$
            - reflect$
            - regexp$
            - regexp/syntax$
            - slices$
            - strconv$
            - strings$
            - sync$
            - time$
            - unicode$
            - unicode/utf16$
            - unicode/utf8$
            - cel.dev/cel-go
            - github.com/f-klement/errata/internal/check$
            - github.com/f-klement/errata/internal/minimatch$
            - github.com/f-klement/errata/internal/semver$
        # A plugin built from this repository reads only the bytes a request
        # carries: it opens no file, starts no program and uses no network
        # (docs/plugin-protocol.md, How errata runs a plugin). An allow list, as
        # above, so a package that reaches the disk or the network through a
        # path no deny list names is refused too. It holds wire and lineend,
        # the two packages of errata's a plugin imports, as well. Its main,
        # below, adds os for stdin, stdout and the exit status, and nothing
        # else. time gives wire the extract timeout and the hcl plugin its
        # deadline, for timers and durations; it reads the zone database in
        # LoadLocation and on first use of Local, such as formatting
        # time.Now(), neither of which a plugin may call. The hcl plugin
        # imports hcl/v2, its hclsyntax and go-cty's cty;
        # depguard reads only this repository's files, so a test of
        # cmd/errata-ext-hcl holds the modules it links to an allow list of
        # its own, the standard packages they import today, and refuses an
        # assembly or cgo file in any of them, on every platform errata
        # ships for.
        plugin-is-offline:
          list-mode: strict
          files:
            - "**/internal/ext/**/*.go"
            - "**/internal/plugin/wire/*.go"
            - "**/internal/extract/core/lineend/*.go"
            - "!$test"
          allow:
            - bytes$
            - encoding/csv$
            - encoding/json$
            - errors$
            - fmt$
            - io$
            - reflect$
            - regexp$
            - slices$
            - strconv$
            - strings$
            - time$
            - unicode$
            - unicode/utf8$
            - github.com/f-klement/errata/internal/plugin/wire$
            - github.com/f-klement/errata/internal/extract/core/lineend$
            - github.com/hashicorp/hcl/v2$
            - github.com/hashicorp/hcl/v2/hclsyntax$
            - github.com/zclconf/go-cty/cty$
        # errata plugin install fetches, and a run never does (ADR 0021), so one package
        # reaches the network: internal/plugin/install. Every other package of internal and cmd
        # is held off the packages that open a connection (net, net/http, crypto/tls, net/rpc,
        # net/smtp, log/syslog, and golang.org/x/net but for golang.org/x/net/html, which parses
        # and opens none), so a verdict cannot depend on a network. net/url and net/netip open
        # none. only-cli-installs holds every file but internal/cli/plugin.go off the installer
        # itself, so no other package fetches through it.
        only-install-fetches:
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "**/cmd/**/*.go"
            - "!**/internal/plugin/install/*.go"
            - "!$test"
          deny:
            - pkg: net$
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
            - pkg: net/http
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
            - pkg: crypto/tls
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
            - pkg: net/rpc
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
            - pkg: net/smtp
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
            - pkg: log/syslog
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
            - pkg: golang.org/x/net
              desc: only internal/plugin/install reaches the network; a run never fetches (ADR 0021)
          allow:
            - golang.org/x/net/html
        only-cli-installs:
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "**/cmd/**/*.go"
            - "!**/internal/cli/plugin.go"
            - "!**/internal/plugin/install/*.go"
            - "!$test"
          deny:
            - pkg: github.com/f-klement/errata/internal/plugin/install$
              desc: only errata plugin install (internal/cli/plugin.go) calls the installer; a run never fetches (ADR 0021)
        plugin-main-is-offline:
          list-mode: strict
          files:
            - "**/cmd/errata-ext-*/*.go"
            - "!$test"
          allow:
            - os$
            - github.com/f-klement/errata/internal/ext/
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
        - name: unreachable-code
        - name: early-return
    gosec:
      excludes:
        - G204 # running the user's check command is the check protocol
        - G304 # reading the config path the user passed is the job
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]
      # What only the extractors' tests import, built as packages of their own.
      - path: internal/extract/(extracttest|coretest)/
        linters: [gosec, forbidigo]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/f-klement/errata]
