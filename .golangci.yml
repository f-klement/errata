# golangci-lint v2. Each linter here catches a defect class, not a style
# preference; style is gofmt and goimports, enforced as formatters.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint      # errors compared with == or type-asserted, which breaks on wrapped errors
    - nilerr         # returns nil after checking err != nil
    - gosec          # exec with tainted input, file permissions, weak crypto
    - gocritic       # a broad set of bug patterns (appendAssign, badCond, dupBranchBody)
    - revive         # exported identifiers without a doc comment, among others
    - exhaustive     # a switch on Scope or Verdict that misses a value
    - unparam        # a parameter that always receives the same value
    - unconvert      # needless conversions that hide a type mismatch
    - nolintlint     # a //nolint without a linter name and a reason
    - misspell
    - copyloopvar
    - intrange
    - perfsprint
    - usetesting     # os.MkdirTemp in tests instead of t.TempDir
    - thelper        # test helpers without t.Helper(), which misreport the failing line
    - forbidigo      # no fmt.Print* outside the CLI: output goes through a Reporter
    - noctx          # exec and net calls without a context cannot be cancelled
    - depguard       # internal/rule importing a package that reads a file, such as the machine's zone files
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an io.Writer passed in, so tests can capture output
        # A verdict must not depend on the machine's zone files, ZONEINFO or TZ.
        - pattern: ^time\.LoadLocation$
          msg: read a named zone with rule's zone(), from the embedded database, never the machine's
        - pattern: ^time\.Local$
          msg: Local is the machine's zone; a verdict must not depend on where errata runs
        # archive/zip is on internal/rule's allow list for the embedded zones; OpenReader would
        # read a zip from the disk.
        - pattern: ^zip\.OpenReader$
          msg: read the embedded zone database with zip.NewReader; errata reads no zip from the disk
    depguard:
      rules:
        # internal/rule evaluates over extracted values and embedded data and reads no file, so
        # no machine state, zone files included, can reach a verdict. An allow list, because a
        # deny list misses a package that reads a file without os (net/http's http.Dir did). Each
        # standard package ends in $, an exact match, since a bare io would admit io/ioutil.
        # errata's own packages stop at check, semver and minimatch: extract reads files.
        # internal/semver and internal/minimatch are held to the same list, since rule's
        # verdicts rest on them.
        rule-reads-no-files:
          list-mode: strict
          # Both globs: the second needs a directory between rule/ and the file, so it
          # covers a subpackage and not the package itself.
          files:
            - "**/internal/rule/*.go"
            - "**/internal/rule/**/*.go"
            - "**/internal/semver/*.go"
            - "**/internal/minimatch/*.go"
            - "!$test"
          allow:
            - archive/zip$
            - bytes$
            - context$
            - embed$
            - errors$
            - fmt$
            - hash/fnv$
            - io$
            - maps$
            - math$
            - net/netip$
            - reflect$
            - regexp$
            - slices$
            - strconv$
            - strings$
            - sync$
            - time$
            - unicode$
            - unicode/utf16$
            - unicode/utf8$
            - cel.dev/cel-go
            - github.com/f-klement/errata/internal/check$
            - github.com/f-klement/errata/internal/minimatch$
            - github.com/f-klement/errata/internal/semver$
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
        - name: unreachable-code
        - name: early-return
    gosec:
      excludes:
        - G204 # running the user's check command is the check protocol
        - G304 # reading the config path the user passed is the job
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]
      # What only the extractors' tests import, built as packages of their own.
      - path: internal/extract/(extracttest|coretest)/
        linters: [gosec, forbidigo]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/f-klement/errata]
