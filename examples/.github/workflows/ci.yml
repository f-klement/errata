name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4
      - run: ruff check .
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mypy src
  publish:
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: "1.4.0"
    steps:
      - run: sh scripts/release.sh
