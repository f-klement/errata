[cache]
# How long a fetched price list stays fresh.
ttl_seconds = 3600

[admin]
# The admin console reads its settings as JSON.
settings = '{"port": 9090}'

[logging]
config = '{"level": "info"}'

[[feeds]]
name = "prices"
url = "https://feeds.example.com/prices.json"

[[feeds]]
name = "recalls"
url = "https://feeds.example.com/recalls.json"

[[schedules]]
name = "prices"
every_seconds = 900

[[schedules]]
name = "recalls"
every_seconds = 1800
